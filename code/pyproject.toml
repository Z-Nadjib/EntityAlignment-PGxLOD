[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-pgxlod"
version = "0.1.0"
description = "Entity alignment on PGxLOD: eight EA models and a structure-only baseline on the leak-free regimes of a single pharmacogenomic knowledge graph."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nadjib Zahaf", email = "zahafndjib@gmail.com" }]
keywords = ["entity-alignment", "knowledge-graph", "pgxlod", "pharmacogenomics", "graph-attention"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "PyYAML>=5.4",
]

[project.scripts]
ea-pgxlod-train = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
