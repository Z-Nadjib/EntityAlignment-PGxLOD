# =============================================================================
#  RREA - Mao et al., CIKM 2020 (https://arxiv.org/abs/2008.07962)
#  Regimes: broadMatch/pgx, broadMatch/onco   (the regime is given by --regime)
#  Hyperparameters: tuned on this relation, dropout 0.15, 8 turns
#  experiment.seed is the model seed; the split seed is data.seed (default 2024).
# =============================================================================
experiment: {name: rrea, model: rrea, seed: 2026, device: cuda}
data: {csv_dir: Data/pgxlod_csv, cache_dir: Data/cache}
model: {node_hidden: 100, depth: 2, attn_heads: 1, dropout: 0.15}
train: {turns: 8, epoch_per_turn: 200, epochs: 400, lr: 0.005, optimizer: rmsprop,
  rms_alpha: 0.9, rms_eps: 1.0e-07, weight_decay: 0.0, gamma: 3.0, csls_k: 10, early_stop_patience: 0}
eval:
  every: 10
  hits_at: [1, 5, 10]
  metric: csls
  csls_k: 10
  select: filtered
  clf_tol_k: 10
logging:
  output_dir: experiments
  log_file: training.txt
  config_dump: config_used.yaml
  save_best: true
  save_last: true
  checkpoint_name: model.pt
  embeddings_name: embeddings.pt
  metrics_csv: metrics.csv
  loss_csv: loss.csv
  plots: {loss_curve: loss_curve.png, ranking_metrics: ranking_metrics.png}
  log_level: INFO
