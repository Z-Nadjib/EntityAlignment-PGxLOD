# =============================================================================
#  GCN-Align - Wang et al., EMNLP 2018 (https://aclanthology.org/D18-1032.pdf)
#  Regimes: related   (the regime is given by --regime)
#  Hyperparameters: default recipe
#  experiment.seed is the model seed; the split seed is data.seed (default 2024).
# =============================================================================
experiment: {name: gcnalign, model: gcnalign, seed: 2026, device: cuda}
data: {csv_dir: Data/pgxlod_csv, cache_dir: Data/cache}
model: {embed_dim: 300, n_layers: 1, dropout: 0.0, activation: false, normalize_embeddings: true,
  self_loop_weight: 0.0}
train: {epochs: 400, lr: 0.001, optimizer: adam, weight_decay: 0.0, grad_clip: 0.0,
  early_stop_patience: 8, margin: 3.0, k: 25}
eval:
  every: 25
  hits_at: [1, 5, 10]
  metric: csls
  csls_k: 3
  select: filtered
  clf_tol_k: 10
logging:
  output_dir: experiments
  log_file: training.txt
  config_dump: config_used.yaml
  save_best: true
  save_last: true
  checkpoint_name: model.pt
  embeddings_name: embeddings.pt
  metrics_csv: metrics.csv
  loss_csv: loss.csv
  plots: {loss_curve: loss_curve.png, ranking_metrics: ranking_metrics.png}
  log_level: INFO
