<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="What the repository provides">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03111C"/><stop offset="0.55" stop-color="#072833"/>
      <stop offset="1" stop-color="#0A3433"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5EEAD4" opacity="0.10"/></pattern></defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.200;1" dur="0.75s" fill="freeze"/><rect x="30" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="30" y="24" width="4" height="150" rx="2" fill="#F5B700"/><rect x="56" y="48" width="8" height="16" rx="2" fill="#F5B700" opacity="0.55"/><rect x="67" y="52" width="8" height="12" rx="2" fill="#F5B700" opacity="0.7000000000000001"/><rect x="78" y="48" width="8" height="16" rx="2" fill="#F5B700" opacity="0.8500000000000001"/><rect x="89" y="52" width="8" height="12" rx="2" fill="#F5B700" opacity="0.55"/><text x="110" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Eight models, one codebase</text><text x="56" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">BootEA, NAEA, JAPE, GCN-Align, AliNet,</text><text x="56" y="123" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">MRAEA, RREA and KECG in PyTorch,</text><text x="56" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">with shared data, metrics and trainers.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.355;1" dur="0.93s" fill="freeze"/><rect x="440" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="440" y="24" width="4" height="150" rx="2" fill="#3B82F6"/><circle cx="470" cy="58" r="3.5" fill="#3B82F6" opacity="1.00"/><circle cx="479" cy="58" r="3.5" fill="#3B82F6" opacity="0.88"/><circle cx="488" cy="58" r="3.5" fill="#3B82F6" opacity="0.76"/><circle cx="497" cy="58" r="3.5" fill="#3B82F6" opacity="0.64"/><circle cx="506" cy="58" r="3.5" fill="#3B82F6" opacity="0.52"/><text x="520" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Six ready-made alignment tasks</text><text x="466" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">sameAs, closeMatch, broadMatch/pgx,</text><text x="466" y="123" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">broadMatch/onco, relatedMatch, related:</text><text x="466" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">pick one with --regime.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.459;1" dur="1.11s" fill="freeze"/><rect x="850" y="24" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="850" y="24" width="4" height="150" rx="2" fill="#2DD4BF"/><ellipse cx="890" cy="51" rx="14" ry="5" fill="none" stroke="#2DD4BF" stroke-width="2"/><path d="M876,51 L876,65 A14,5 0 0 0 904,65 L904,51" fill="none" stroke="#2DD4BF" stroke-width="2"/><text x="930" y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Splits built once, then cached</text><text x="876" y="102" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Graph and splits are read from the CSV</text><text x="876" y="123" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">extraction once, cached under Data/cache,</text><text x="876" y="144" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">and shared by every run.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.535;1" dur="1.29s" fill="freeze"/><rect x="30" y="190" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="30" y="190" width="4" height="150" rx="2" fill="#22C55E"/><rect x="56" y="222" width="6" height="10" rx="1.5" fill="#22C55E"><animate attributeName="height" values="10;5;10" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="y" values="222;227;222" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="65" y="216" width="6" height="16" rx="1.5" fill="#22C55E"><animate attributeName="height" values="16;8;16" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="216;224;216" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></rect><rect x="74" y="212" width="6" height="20" rx="1.5" fill="#22C55E"><animate attributeName="height" values="20;10;20" dur="2.4s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="212;222;212" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></rect><rect x="83" y="219" width="6" height="13" rx="1.5" fill="#22C55E"><animate attributeName="height" values="13;6;13" dur="2.4s" begin="0.6000000000000001s" repeatCount="indefinite"/><animate attributeName="y" values="219;226;219" dur="2.4s" begin="0.6000000000000001s" repeatCount="indefinite"/></rect><text x="110" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Ranking and decision metrics</text><text x="56" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Filtered and multiref MRR, Hit@k,</text><text x="56" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">tie-aware ranks, CSLS scoring, and a</text><text x="56" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">top-10 decision F1.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.592;1" dur="1.47s" fill="freeze"/><rect x="440" y="190" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="440" y="190" width="4" height="150" rx="2" fill="#A78BFA"/><rect x="466" y="212" width="22" height="26" rx="3" fill="none" stroke="#A78BFA" stroke-width="2"/><line x1="471" y1="219" x2="483" y2="219" stroke="#A78BFA" stroke-width="1.6"/><line x1="471" y1="225" x2="479" y2="225" stroke="#A78BFA" stroke-width="1.6"/><line x1="471" y1="231" x2="483" y2="231" stroke="#A78BFA" stroke-width="1.6"/><text x="520" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">One YAML config per run</text><text x="466" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Every hyperparameter lives in configs/;</text><text x="466" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">the exact configuration is saved with</text><text x="466" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">each run for reproducibility.</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.636;1" dur="1.65s" fill="freeze"/><rect x="850" y="190" width="396" height="150" rx="14" fill="#0B2530" stroke="#1E3A45"/><rect x="850" y="190" width="4" height="150" rx="2" fill="#EF4444"/><rect x="876" y="214" width="28" height="4" rx="1.5" fill="#EF4444" opacity="1.00"/><rect x="876" y="221" width="28" height="4" rx="1.5" fill="#EF4444" opacity="0.75"/><rect x="876" y="228" width="28" height="4" rx="1.5" fill="#EF4444" opacity="0.50"/><text x="930" y="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#E6F1F5">Campaigns and tables included</text><text x="876" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">Run every model on every task, add the</text><text x="876" y="289" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">structure-only baseline, and build the</text><text x="876" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8FA9B8">markdown result tables.</text></g>
</svg>